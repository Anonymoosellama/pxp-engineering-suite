# SPDX-License-Identifier: LGPL-2.1-or-later
[package]
name = "pxp-cli"
description = "Headless command-line interface for PXP Engineering Suite (the MCP server and journaling arrive in sub-stage 0I)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "pxp-cli"
path = "src/main.rs"

[dependencies]
pxp-units = { workspace = true }
serde_json = { workspace = true }
pxp-compute = { workspace = true }
pxp-doc = { workspace = true }
pxp-math = { workspace = true }
pxp-format = { workspace = true }
pxp-kernel = { workspace = true }
# The shell chooses the geometry backend (ADR-0004 bake-off candidate).
pxp-kernel-native = { workspace = true }
pxp-appkit = { workspace = true }
pxp-app-modeling = { workspace = true }
pxp-app-drafting = { workspace = true }
pxp-app-manufacturing = { workspace = true }
pxp-app-postgen = { workspace = true }
pxp-app-machine-kit = { workspace = true }
pxp-app-cae = { workspace = true }
# Placeholder crates, linked only so `pxp-cli status` reports their planned
# stage from the crates themselves rather than from a hand-kept list.
pxp-kernel-occt = { workspace = true }
pxp-sketch = { workspace = true }
pxp-tess = { workspace = true }
pxp-render = { workspace = true }
pxp-io = { workspace = true }
pxp-io-step = { workspace = true }
pxp-io-iges = { workspace = true }
pxp-io-dxf = { workspace = true }
pxp-io-pdf = { workspace = true }
pxp-io-stl = { workspace = true }
pxp-io-3mf = { workspace = true }
pxp-cam = { workspace = true }
pxp-additive = { workspace = true }
pxp-machine = { workspace = true }
pxp-post = { workspace = true }
pxp-vnc = { workspace = true }
pxp-fea = { workspace = true }
pxp-topopt = { workspace = true }
pxp-scan = { workspace = true }
pxp-pointcloud = { workspace = true }
pxp-ui = { workspace = true }
