# SPDX-License-Identifier: LGPL-2.1-or-later
#
# cargo-deny policy. See docs/adr/ADR-0001-project-licence.md for why each
# licence is (or is not) on the allow list.

[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = []

[licenses]
confidence-threshold = 0.93
allow = [
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    # The LLVM exception waives the Apache sections that conflict with
    # GPLv2-family licences, so this is compatible with LGPL-2.1.
    "Apache-2.0 WITH LLVM-exception",
    "LGPL-2.0-or-later",
    "LGPL-2.1-or-later",
]
# Plain "Apache-2.0" is NOT globally allowed. "MIT OR Apache-2.0" crates pass
# via MIT. An Apache-2.0-ONLY crate must be listed here, and recorded in
# ADR-0001, because linking it means binaries are conveyed under LGPL-3.0.
exceptions = [
    # SolidCore, the B-rep kernel under SolidCraft's kernel (pxp-kernel-native,
    # the ADR-0004 bake-off candidate), is Apache-2.0 only. Binaries that link
    # it are conveyed under LGPL-3.0 (ADR-0001, "Registered Apache-2.0-only
    # exceptions"). All six crates come from one pinned git revision.
    { allow = ["Apache-2.0"], crate = "solidcore" },
    { allow = ["Apache-2.0"], crate = "solidcore-convert" },
    { allow = ["Apache-2.0"], crate = "solidcore-ops" },
    { allow = ["Apache-2.0"], crate = "solidcore-record" },
    { allow = ["Apache-2.0"], crate = "solidcore-step" },
    { allow = ["Apache-2.0"], crate = "solidcore-tess" },
    # The desktop shell's window and graphics stack (ADR-0002: eframe on
    # winit and wgpu). Each is Apache-2.0 only (or, for self_cell,
    # "Apache-2.0 OR GPL-2.0-only", taken as Apache-2.0), so the desktop
    # binary `pxp` is conveyed under LGPL-3.0 (ADR-0001, registered
    # 2026-11-22). Every winit-based Rust toolkit, iced included, has the
    # same dependency.
    { allow = ["Apache-2.0"], crate = "winit" },
    { allow = ["Apache-2.0"], crate = "dpi" },
    { allow = ["Apache-2.0"], crate = "accesskit_winit" },
    { allow = ["Apache-2.0"], crate = "gethostname" },
    { allow = ["Apache-2.0"], crate = "codespan-reporting" },
    { allow = ["Apache-2.0"], crate = "spirv" },
    { allow = ["Apache-2.0"], crate = "gl_generator" },
    { allow = ["Apache-2.0"], crate = "khronos_api" },
    { allow = ["Apache-2.0"], crate = "glutin_wgl_sys" },
    { allow = ["Apache-2.0"], crate = "unicode-general-category" },
    { allow = ["Apache-2.0"], crate = "self_cell" },
    # egui's bundled fonts (Ubuntu-Light, Hack, Noto Emoji): font licences
    # that permit bundling with software of any licence.
    { allow = ["OFL-1.1", "Ubuntu-font-1.0"], crate = "epaint_default_fonts" },
]

[licenses.private]
# Our own crates are publish = false and LGPL-2.1-or-later (already allowed).
ignore = false

[bans]
multiple-versions = "deny"
wildcards = "deny"
# Internal path dependencies carry no version; that is fine for unpublished
# workspace crates.
allow-wildcard-paths = true
skip = [
    { crate = "bitflags", reason = "GUI stack (eframe, winit, wgpu, accesskit): two or three major versions in flight across that ecosystem, 2026-11; revisit at each eframe upgrade." },
    { crate = "block2", reason = "GUI stack (eframe, winit, wgpu, accesskit): two or three major versions in flight across that ecosystem, 2026-11; revisit at each eframe upgrade." },
    { crate = "getrandom", reason = "GUI stack (eframe, winit, wgpu, accesskit): two or three major versions in flight across that ecosystem, 2026-11; revisit at each eframe upgrade." },
    { crate = "jni-sys", reason = "GUI stack (eframe, winit, wgpu, accesskit): two or three major versions in flight across that ecosystem, 2026-11; revisit at each eframe upgrade." },
    { crate = "linux-raw-sys", reason = "GUI stack (eframe, winit, wgpu, accesskit): two or three major versions in flight across that ecosystem, 2026-11; revisit at each eframe upgrade." },
    { crate = "miniz_oxide", reason = "GUI stack (eframe, winit, wgpu, accesskit): two or three major versions in flight across that ecosystem, 2026-11; revisit at each eframe upgrade." },
    { crate = "objc2", reason = "GUI stack (eframe, winit, wgpu, accesskit): two or three major versions in flight across that ecosystem, 2026-11; revisit at each eframe upgrade." },
    { crate = "objc2-app-kit", reason = "GUI stack (eframe, winit, wgpu, accesskit): two or three major versions in flight across that ecosystem, 2026-11; revisit at each eframe upgrade." },
    { crate = "objc2-foundation", reason = "GUI stack (eframe, winit, wgpu, accesskit): two or three major versions in flight across that ecosystem, 2026-11; revisit at each eframe upgrade." },
    { crate = "objc2-ui-kit", reason = "GUI stack (eframe, winit, wgpu, accesskit): two or three major versions in flight across that ecosystem, 2026-11; revisit at each eframe upgrade." },
    { crate = "r-efi", reason = "GUI stack (eframe, winit, wgpu, accesskit): two or three major versions in flight across that ecosystem, 2026-11; revisit at each eframe upgrade." },
    { crate = "rand_core", reason = "GUI stack (eframe, winit, wgpu, accesskit): two or three major versions in flight across that ecosystem, 2026-11; revisit at each eframe upgrade." },
    { crate = "redox_syscall", reason = "GUI stack (eframe, winit, wgpu, accesskit): two or three major versions in flight across that ecosystem, 2026-11; revisit at each eframe upgrade." },
    { crate = "rustc-hash", reason = "GUI stack (eframe, winit, wgpu, accesskit): two or three major versions in flight across that ecosystem, 2026-11; revisit at each eframe upgrade." },
    { crate = "rustix", reason = "GUI stack (eframe, winit, wgpu, accesskit): two or three major versions in flight across that ecosystem, 2026-11; revisit at each eframe upgrade." },
    { crate = "syn", reason = "GUI stack (eframe, winit, wgpu, accesskit): two or three major versions in flight across that ecosystem, 2026-11; revisit at each eframe upgrade." },
    { crate = "thiserror", reason = "GUI stack (eframe, winit, wgpu, accesskit): two or three major versions in flight across that ecosystem, 2026-11; revisit at each eframe upgrade." },
    { crate = "thiserror-impl", reason = "GUI stack (eframe, winit, wgpu, accesskit): two or three major versions in flight across that ecosystem, 2026-11; revisit at each eframe upgrade." },
    { crate = "windows-sys", reason = "GUI stack (eframe, winit, wgpu, accesskit): two or three major versions in flight across that ecosystem, 2026-11; revisit at each eframe upgrade." },
    { crate = "hashbrown@0.16.1", reason = "spade (the triangulator in SolidCraft's tessellator) needs 0.16 while rusqlite's hashlink needs 0.17; both MIT OR Apache-2.0. Drop when spade moves on." },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# SolidCraft's kernel is not on crates.io; the workspace pins one commit
# (Cargo.toml, ADR-0004).
allow-git = ["https://github.com/tangency-labs/solidcraft"]
